name: Question
description: Ask a question about Faithful.
labels:
- question
body:
- type: markdown
  attributes:
    value: Please check existing issues before submitting a new one. You can paste or drag images and screenshots into text boxes.
- type: textarea
  id: description
  attributes:
    label: Your Question
    description: Feel free to include any relevant details or images that might help.
  validations:
    required: true
- type: input
  id: faithful-version
  attributes:
    label: Faithful Version (optional)
    description: If known, provide the version of Faithful you are using.
    placeholder: e.g. the version shown in r2modman
  validations:
    required: false
