name: Bug Report
description: Report a bug, crash, or unexpected behaviour in Faithful.
labels:
- bug
body:
- type: markdown
  attributes:
    value: Please check existing issues before submitting a new one. You can paste or drag images and screenshots into text boxes.
- type: textarea
  id: description
  attributes:
    label: Bug Description
    description: Explain what happened and what you expected instead. Screenshots or images are welcome.
  validations:
    required: true
- type: checkboxes
  id: issue-impact
  attributes:
    label: Issue Impact
    description: Select any that apply to this issue.
    options:
      - label: "Fatal: The game crashes, fails to start, or cannot initialise."
        required: false
      - label: "Mod load failure: Faithful fails to load or initialise correctly."
        required: false
      - label: "Softlock: The game remains running, but this issue can prevent the player from continuing gameplay."
        required: false
- type: textarea
  id: game-log
  attributes:
    label: Game Log (optional)
    description: |
      Logs can help us identify the cause of an issue.

      To obtain your log after reproducing the issue:
      1. Open r2modman.
      2. Navigate to Settings → Debugging.
      3. Select "Copy log to clipboard".

      For large logs, paste the contents into a .txt file
      and attach it here rather than pasting it directly.

      You can also paste a short, relevant excerpt.
    placeholder: "Attach your log file or paste relevant log output here."
  validations:
    required: false
- type: textarea
  id: steps-to-reproduce
  attributes:
    label: Steps to Reproduce (optional)
    description: If possible, list the actions that consistently cause this issue. Reproduction steps help us confirm the problem and test a fix.
    placeholder: |-
      1. Start the game with...
      2. Go to...
      3. Do...
      4. Observe...
  validations:
    required: false
- type: input
  id: faithful-version
  attributes:
    label: Faithful Version (optional)
    description: If known, provide the version of Faithful you are using.
    placeholder: e.g. the version shown in r2modman
  validations:
    required: false
