name: Compatibility Report
description: Report a conflict or unexpected interaction with another mod.
labels:
- compatibility
body:
- type: markdown
  attributes:
    value: Please check existing issues before submitting a new one. You can paste or drag images and screenshots into text boxes.
- type: textarea
  id: description
  attributes:
    label: Compatibility Issue
    description: Explain how Faithful and another mod interact unexpectedly. Include screenshots or images if helpful.
  validations:
    required: true
- type: checkboxes
  id: issue-impact
  attributes:
    label: Issue Impact
    description: Select any that apply to this issue.
    options:
      - label: "Fatal: The game crashes, fails to start, or cannot initialise."
        required: false
      - label: "Mod load failure: Faithful fails to load or initialise correctly."
        required: false
      - label: "Softlock: The game remains running, but this issue can prevent the player from continuing gameplay."
        required: false
- type: input
  id: relevant-mod
  attributes:
    label: Relevant Mod Link
    description: |
      (optional)

      Link to the other mod (for example, its Thunderstore or GitHub page).
    placeholder: https://thunderstore.io/...
  validations:
    required: false
- type: textarea
  id: game-log
  attributes:
    label: Game Log
    description: |
      (optional)

      Logs can help us identify the cause of an issue.

      To obtain your log after reproducing the issue:
      1. Open r2modman.
      2. Navigate to Settings -> Debugging.
      3. Select "Copy log to clipboard".

      For large logs, paste the contents into a .txt file
      and attach it here rather than pasting it directly.

      You can also paste a short, relevant excerpt.
    placeholder: "Attach your log file or paste relevant log output here."
  validations:
    required: false
- type: textarea
  id: steps-to-reproduce
  attributes:
    label: Steps to Reproduce
    description: |
      (optional)

      If relevant, list the actions that consistently cause this issue. Reproduction steps help us confirm the problem and test a fix.
    placeholder: |-
      1. Start the game with...
      2. Go to...
      3. Do...
      4. Observe...
  validations:
    required: false
- type: input
  id: faithful-version
  attributes:
    label: Faithful Version
    description: |
      (optional)

      If known, provide the version of Faithful you are using.
    placeholder: e.g. the version shown in r2modman
  validations:
    required: false
- type: input
  id: discord-username
  attributes:
    label: Link Discord?
    description: |
      (optional)

      We grant a Contributor role and README credits to Discord members whose suggestions or reports make it into published Faithful versions. If you're interested, join our Discord [here](https://discord.gg/uV37nwn9Us).
    placeholder: Discord username or display name
  validations:
    required: false
