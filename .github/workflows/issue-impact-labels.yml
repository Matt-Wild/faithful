
name: Issue Impact Labels

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest

    steps:
      - name: Apply impact labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const labels = new Set(issue.labels.map(label => label.name));

            const isBug = labels.has('bug');
            const isCompatibility = labels.has('compatibility');
            const isPerformance = labels.has('performance');

            // Ignore issue types that do not have these checkboxes.
            if (!isBug && !isCompatibility && !isPerformance) return;

            // Return true, false, or null (if the checkbox is missing).
            function checkboxState(option) {
              const checked = `- [x] ${option}:`.toLowerCase();
              const unchecked = `- [ ] ${option}:`.toLowerCase();

              for (const line of body.split(/\r?\n/)) {
                const value = line.trim().toLowerCase();
                // Match the impact prefix so changes to its description do not break labels.
                if (value.startsWith(checked)) return true;
                if (value.startsWith(unchecked)) return false;
              }

              return null;
            }

            const rules = [
              {
                label: 'fatal',
                option: 'Fatal',
                enabled: isBug || isCompatibility || isPerformance
              },
              {
                label: 'mod load failure',
                option: 'Mod load failure',
                enabled: isBug || isCompatibility
              },
              {
                label: 'softlock',
                option: 'Softlock',
                enabled: isBug || isCompatibility
              }
            ];

            for (const rule of rules) {
              if (!rule.enabled) continue;

              const checked = checkboxState(rule.option);

              // Leave older issues without the checkbox unchanged.
              if (checked === null) continue;

              if (checked && !labels.has(rule.label)) {
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: issue.number,
                  labels: [rule.label]
                });
              } else if (!checked && labels.has(rule.label)) {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: issue.number,
                  name: rule.label
                });
              }
            }
